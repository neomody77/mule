name: mule
description: "Mule - 移动端远程编码平台"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # WebSocket
  web_socket_channel: ^3.0.0

  # 状态管理

  # HTTP 客户端
  dio: ^5.4.0

  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Markdown 渲染
  flutter_markdown: ^0.7.4

  # 代码高亮
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # UUID
  uuid: ^4.3.3

  # 工具
  intl: ^0.19.0

  # URL 启动器
  url_launcher: ^6.2.5
  http: ^1.6.0
  mobile_scanner: ^7.1.4

  # 状态管理 - Riverpod
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.1

  # Clerk 认证 (可选)
  clerk_flutter: ^0.0.10-beta

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#F2F4F2"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
